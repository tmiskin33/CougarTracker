<!doctype html>
<!-- SYNTHETIC FIXTURE — stands in for the CAS sign-in page a lapsed session lands on. -->
<html lang="en">
<head><title>BYU CAS &ndash; Sign In</title></head>
<body>
  <h1>Sign in to BYU</h1>
  <form action="https://cas.byu.edu/cas/login" method="post">
    <label for="netid">BYU Net ID</label>
    <input id="netid" name="username" type="text">
    <label for="password">Password</label>
    <input id="password" name="password" type="password">
    <button type="submit">Sign In</button>
  </form>
  <p>Duo Security two-factor authentication is required.</p>
</body>
</html>
