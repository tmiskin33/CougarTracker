name: Build and test

# Builds the app and runs the test suite on a macOS runner, so a compile error
# shows up here rather than the first time someone opens Xcode.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Choose a simulator
        id: sim
        run: |
          # Runner images change which devices they ship, so pick whatever
          # iPhone is actually installed rather than pinning a model.
          DEVICE=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [^(]*' \
            | head -1 \
            | sed 's/[[:space:]]*$//')
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          # xcodebuild's raw output is thousands of lines of compiler
          # invocations. Send it to a file and surface only the diagnostics,
          # so a failure is readable without downloading the whole log.
          set +e
          xcodebuild build-for-testing \
            -project CougarDeadlineTracker.xcodeproj \
            -scheme CougarDeadlineTracker \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          STATUS=$?
          echo "----- diagnostics -----"
          grep -E '(error|warning): ' build.log \
            | sed 's|.*/CougarTracker/||' \
            | sort -u \
            | head -100
          echo "----- end diagnostics -----"
          if [ $STATUS -ne 0 ]; then
            echo "----- tail of build log -----"
            tail -30 build.log
          fi
          exit $STATUS

      - name: Test
        run: |
          set +e
          xcodebuild test-without-building \
            -project CougarDeadlineTracker.xcodeproj \
            -scheme CougarDeadlineTracker \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          STATUS=$?
          echo "----- failures -----"
          grep -E "(error:|XCTAssert|failed \(|Test Case .* failed)" test.log \
            | sed 's|.*/CougarTracker/||' \
            | head -80
          echo "----- summary -----"
          grep -E "Test Suite '.*' (passed|failed)|Executed [0-9]+ test" test.log | tail -10
          exit $STATUS

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
